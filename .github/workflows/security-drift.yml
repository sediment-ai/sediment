# Pull requests skip artifact scans that their diff cannot affect, so upstream
# drift (a new advisory, a package release, an expiring review) fails the full
# security run on main or its daily schedule instead. This workflow keeps that
# failure visible as one open tracking issue.
#
# A separate workflow_run workflow, not a job in security.yml: release.yaml
# calls security.yml with a read-only token, and a nested job requesting
# issues: write would fail that call.
name: security drift

on:
  workflow_run:
    workflows: [security]
    types: [completed]

permissions:
  issues: write

jobs:
  report:
    # Only trusted main-branch runs; pull-request failures stay on the PR.
    if: >-
      github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.head_branch == 'main'
      && (github.event.workflow_run.event == 'push'
      || github.event.workflow_run.event == 'schedule')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      TITLE: Security scan failed on main
    steps:
      - name: Open or update the drift issue
        run: |
          set -euo pipefail
          number="$(gh issue list --state open --label security --search "in:title \"$TITLE\"" \
            --json number,title --jq '[.[] | select(.title == env.TITLE)][0].number // empty')"
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$TITLE" --label needs-triage --label security \
              --body "The full security workflow failed on main: $RUN_URL

          Pull requests that do not touch a scan input skip the artifact scans, so this failure reflects upstream drift or an expiring review rather than one pull request. Download the security-evidence artifacts from the run, then apply the fix or review the disposition as CONTRIBUTING.md describes."
          fi

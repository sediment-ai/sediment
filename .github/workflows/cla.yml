# Contributors sign CLA.md once before their first pull request merges. The
# action reads only pull-request metadata and comments;
# it never checks out or runs pull-request code, which keeps
# pull_request_target safe here. Signatures live in this repository on the
# unprotected `cla-signatures` branch, so no personal access token is needed.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA')))
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/v1/cla.json
          path-to-document: https://github.com/sediment-ai/sediment/blob/main/CLA.md
          branch: cla-signatures
          # The action checks commit authors. Claude Code commits made for the
          # maintainer resolve to the `claude` login.
          allowlist: ericpaulsen,claude,dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false

<?xml version="1.0" encoding="UTF-8"?>
<!--
  Editable source for architecture-dark.svg / architecture-light.svg.
  Regenerate text-outlined variants:

    sed 's/#111111/#F1EEE7/g; s/#FFFFFF/#111111/g; s/#F13D4F/#C42033/g' \
      architecture.src.svg > /tmp/arch-light-src.svg
    rsvg-convert -f svg architecture.src.svg -o architecture-dark.svg
    rsvg-convert -f svg /tmp/arch-light-src.svg -o architecture-light.svg

  Restore source metadata after outlining (rsvg-convert drops accessibility attributes):

    uv run python - <<'PY'
    from pathlib import Path
    from xml.etree import ElementTree as ET
    from xml.sax.saxutils import quoteattr

    source = ET.parse("architecture.src.svg").getroot()
    for theme in ("dark", "light"):
        path = Path(f"architecture-{theme}.svg")
        svg = path.read_text()
        root = ET.fromstring(svg)
        attributes = " ".join(
            f"{name}={quoteattr(source.attrib[name])}"
            for name in ("viewBox", "role", "aria-label")
            if name not in root.attrib
        )
        if attributes:
            path.write_text(svg.replace("<svg ", f"<svg {attributes} ", 1))
    PY

  Dark: ground #111111, ink #FFFFFF, signal #F13D4F.
  Light: paper #F1EEE7, ink #111111, accent #C42033.
-->

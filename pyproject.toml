[project]
# Virtual workspace root — not a distribution. The installable CLI is the
# top-level cli/ member (distribution `sediment-cli`, command `sediment`);
# everything publishes from the members.
name = "sediment"
version = "0.7.1"
description = "A self-hosted evidence store for coding agents"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = [
    "sediment-core==0.7.1",
    "sediment-capture==0.7.1",
    "sediment-derive==0.7.1",
    "sediment-export==0.7.1",
    "sediment-api==0.7.1",
    "sediment-cli==0.7.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "pytest-xdist>=3.8.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/*", "cli"]

[tool.uv.sources]
sediment-core = { workspace = true }
sediment-capture = { workspace = true }
sediment-derive = { workspace = true }
sediment-export = { workspace = true }
sediment-api = { workspace = true }
sediment-cli = { workspace = true }

[tool.ruff]
line-length = 88
target-version = "py312"
# Keep the Python-only formatter scope used before Ruff 0.16.
include = ["*.py", "*.pyi", "*.ipynb", "**/pyproject.toml"]

[tool.ruff.lint]
# E/F: the pre-0.16 contract. FIX/ERA/PGH: no deferred-work tags, no
# commented-out code, no blanket noqa or type: ignore. Pair with
# scripts/check_comments.py for cross-language excuse phrases and density.
select = ["E4", "E7", "E9", "F", "ERA", "FIX", "PGH003", "PGH004"]

[tool.ruff.lint.per-file-ignores]
# Semgrep ruleid/ok markers look like commented-out code to eradicate.
"security/**" = ["ERA001"]
# Hand-derived expected values in calibration/significance tests.
"packages/export/tests/test_calibration.py" = ["ERA001"]
"packages/export/tests/test_outcome_report.py" = ["ERA001"]
"packages/export/tests/test_significance.py" = ["ERA001"]
"packages/export/tests/test_similarity_score_calibration.py" = ["ERA001"]

[tool.pytest.ini_options]
testpaths = ["packages", "apps", "cli", "scripts", "sim", "litellm"]
markers = [
    "cluster_roles: run first, before any test provisions deployment roles",
    "serial: run after the parallel pass without concurrent test load",
]

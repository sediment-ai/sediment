[project]
name = "sediment-api"
version = "0.2.0"
description = "Sediment ingest API: facts in through three doors"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    # Security floor for HTTPX/Starlette, including installations from wheels.
    "anyio>=4.15.1",
    "fastapi>=0.141.1",
    "httpx>=0.27",
    "uvicorn>=0.53.0",
    "pydantic-settings>=2.15.0",
    "sediment-core==0.2.0",
    "sediment-capture==0.2.0",
    "sediment-derive==0.2.0",
    "sediment-export==0.2.0",
]

[project.urls]
Source = "https://github.com/sediment-ai/sediment"
Documentation = "https://github.com/sediment-ai/sediment/tree/main/docs"
Issues = "https://github.com/sediment-ai/sediment/issues"
Changelog = "https://github.com/sediment-ai/sediment/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sediment_api"]

[tool.uv.sources]
sediment-core = { workspace = true }
sediment-capture = { workspace = true }
sediment-derive = { workspace = true }
sediment-export = { workspace = true }

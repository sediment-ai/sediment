    VendorCIRequest:
      properties:
        provider:
          $ref: '#/components/schemas/CIProvider'
          description: The normalized CI system. The sender declares it from integration
            configuration; Sediment does not infer it from a URL
        run_id:
          type: string
          pattern: ^[^\u0000\uD800-\uDFFF]*$
          title: Run Id
          description: The provider-issued pipeline-run id, unique within the deployment
            organization and provider namespace
        run_attempt:
          anyOf:
          - type: integer
            maximum: 9.223372036854776e+18
            minimum: 1.0
          - type: 'null'
          title: Run Attempt
        repo:
          type: string
          pattern: ^[^\u0000\uD800-\uDFFF]*$
          title: Repo
        repository_provider:
          anyOf:
          - $ref: '#/components/schemas/ForgeProvider'
          - type: 'null'
        repository_host:
          anyOf:
          - type: string
            pattern: ^[^\u0000\uD800-\uDFFF]*$
          - type: 'null'
          title: Repository Host
        repository_id:
          anyOf:
          - type: string
            pattern: ^[^\u0000\uD800-\uDFFF]*$
          - type: 'null'
          title: Repository Id
        commit_sha:
          type: string
          title: Commit Sha
        branch:
          type: string
          pattern: ^[^\u0000\uD800-\uDFFF]*$
          title: Branch
        workflow_name:
          type: string
          title: Workflow Name
          default: ''
        workflow_id:
          anyOf:
          - type: string
            pattern: ^[^\u0000\uD800-\uDFFF]*$
          - type: 'null'
          title: Workflow Id
        workflow_path:
          anyOf:
          - type: string
            pattern: ^[^\u0000\uD800-\uDFFF]*$
          - type: 'null'
          title: Workflow Path
        result:
          $ref: '#/components/schemas/CIResult'
        run_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Run Url
        provider_result:
          anyOf:
          - type: string
          - type: 'null'
          title: Provider Result
        error_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Type
        reason:
          anyOf:
          - type: string
            maxLength: 4096
          - type: 'null'
          title: Reason
        source_event_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Event Type
        source_spec_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Spec Version
        source_event_id:
          anyOf:
          - type: string
            pattern: ^[^\u0000\uD800-\uDFFF]*$
          - type: 'null'
          title: Source Event Id
      additionalProperties: false
      type: object
      required:
      - provider
      - run_id
      - repo
      - commit_sha
      - branch
      - result
      title: VendorCIRequest
      description: 'The vendor-neutral CI outcome payload — callers normalize their
        own

        CI system into this shape. ``extra="forbid"`` so a caller naming

        an org or fabricating fields is rejected at the boundary.


        The identity fields carry the shared core definitions on

        the envelope, so malformed input 422s at the door rather than

        surfacing as a ValidationError-turned-500 inside the handler:

        ``CommitSha`` (40- and 64-char object names — a SHA-256 repo can use

        this door), ``RepoSlug`` (required — a vendor fact without a repo has

        no CI-attach join), ``BranchName`` (``refs/heads/x`` normalizes to

        ``x``, one recovery lineage bucket per pipeline), and a required

        non-empty ``run_id``. ``run_url`` is optional location metadata.'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Named SEDIMENT_INGEST_TOKENS credential or legacy SEDIMENT_API_BEARER_TOKEN.
        Capture authority only; missing/invalid returns401.
    operatorBearerAuth:
      type: http
      scheme: bearer
      description: SEDIMENT_OPERATOR_TOKEN. Operator access and explicit operator
        ingest; missing/invalid returns401, ingest authority on an operator route
        returns403.
    retrievalBearerAuth:
      type: http
      scheme: bearer
      description: SEDIMENT_RETRIEVAL_TOKEN. Read-only access to the configured source
        Session through /query/context and /v1/me; all existing ingest and operator
        reads return403.
    githubWebhookSignature:
      type: apiKey
      in: header
      name: X-Hub-Signature-256
      description: GitHub webhook HMAC-SHA256 of the raw body, keyed with SEDIMENT_GITHUB_WEBHOOK_SECRET.
        Missing/invalid -> 401.

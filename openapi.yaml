components:
  schemas:
    AgentHarness:
      type: string
      enum:
      - claude-code
      - copilot
      - codex
      - cursor
      - pi
      title: AgentHarness
    AttributedCommitSummary:
      properties:
        repo:
          type: string
          title: Repo
        commit_sha:
          type: string
          title: Commit Sha
        attribution_sources:
          items:
            $ref: '#/components/schemas/AttributionSource'
          type: array
          title: Attribution Sources
        minimum_similarity:
          anyOf:
          - type: number
          - type: 'null'
          title: Minimum Similarity
        maximum_similarity:
          anyOf:
          - type: number
          - type: 'null'
          title: Maximum Similarity
        attributed_files:
          anyOf:
          - type: integer
          - type: 'null'
          title: Attributed Files
        session_commit_observation_ids:
          items:
            type: string
            pattern: ^[^\u0000\uD800-\uDFFF]*$
          type: array
          title: Session Commit Observation Ids
          default: []
        repository_identity:
          anyOf:
          - $ref: '#/components/schemas/RepositoryIdentity'
          - type: 'null'
      type: object
      required:
      - repo
      - commit_sha
      - attribution_sources
      - minimum_similarity
      - maximum_similarity
      - attributed_files
      title: AttributedCommitSummary
      description: 'Observation-backed Session edge with compatibility Attribution
        fields.


        ``attribution_sources`` is empty. Similarity extrema and ``attributed_files``

        are unavailable (None), so the Session dossier omits them from JSON.'
    AttributionSource:
      type: string
      enum:
      - git_notes
      - jaccard
      title: AttributionSource
    CIOutcomeFound:

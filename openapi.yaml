openapi: 3.1.0
info:
  title: Sediment API
  description: 'Self-hosted ingest: facts in through three doors (ADR 0001)'
  version: 0.1.0
paths:
  /ingest/gateway:
    post:
      tags:
      - gateway
      summary: Ingest Gateway
      operationId: ingest_gateway_ingest_gateway_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GatewayIngestRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Ingest Gateway Ingest Gateway Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
        '403':
          description: Ingest or operator authority required.
      security:
      - bearerAuth: []
      - operatorBearerAuth: []
  /ingest/github/push:
    post:
      tags:
      - forge
      summary: Ingest Push
      operationId: ingest_push_ingest_github_push_post
      parameters:
      - name: x-github-event
        in: header
        required: true
        schema:
          type: string
          title: X-Github-Event
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Ingest Push Ingest Github Push Post
        '503':
          description: Database unavailable, or stored Push awaits retry after mirror
            admission failure.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
      security:
      - githubWebhookSignature: []
  /ingest/github/repository:
    post:
      tags:
      - forge
      summary: Ingest Repository
      description: Store an immutable rename receipt independently of mirror availability.
      operationId: ingest_repository_ingest_github_repository_post
      parameters:
      - name: x-github-event
        in: header
        required: true
        schema:
          type: string
          title: X-Github-Event
      - name: x-github-delivery
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Github-Delivery
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Ingest Repository Ingest Github Repository Post
        '503':
          description: Mirror work capacity, storage, or execution budget exceeded.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
      security:
      - githubWebhookSignature: []
  /ingest/github/ci:
    post:
      tags:
      - forge
      summary: Ingest Ci
      operationId: ingest_ci_ingest_github_ci_post
      parameters:
      - name: x-github-event
        in: header
        required: true
        schema:
          type: string
          title: X-Github-Event
      - name: x-github-delivery
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Github-Delivery
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Ingest Ci Ingest Github Ci Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
      security:
      - githubWebhookSignature: []
  /ingest/github/pull-request:
    post:
      tags:
      - forge
      summary: Ingest Pull Request
      operationId: ingest_pull_request_ingest_github_pull_request_post
      parameters:
      - name: x-github-event
        in: header
        required: true
        schema:
          type: string
          title: X-Github-Event
      - name: x-github-delivery
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Github-Delivery
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Ingest Pull Request Ingest Github Pull Request Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
      security:
      - githubWebhookSignature: []
  /ingest/ci:
    post:
      tags:
      - ci-vendor
      summary: Ingest Ci Vendor
      operationId: ingest_ci_vendor_ingest_ci_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorCIRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Ingest Ci Vendor Ingest Ci Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
        '403':
          description: Ingest or operator authority required.
      security:
      - bearerAuth: []
      - operatorBearerAuth: []
  /v1/logs:
    post:
      tags:
      - otlp
      summary: Ingest Otlp Logs
      operationId: ingest_otlp_logs_v1_logs_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Ingest Otlp Logs V1 Logs Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
        '403':
          description: Ingest or operator authority required.
      security:
      - bearerAuth: []
      - operatorBearerAuth: []
  /query/evidence:
    get:
      tags:
      - query
      summary: Query Evidence Inventory
      description: 'Inventory captured Inference calls without message content or
        raw payloads.


        The complete visible inventory has at most 1,000 calls, 8 MiB of source

        metadata, and a 1 MiB response. An unknown Session returns ``found: false``.

        Each request checks live scope and Quarantine in one database snapshot.'
      operationId: query_evidence_inventory_query_evidence_get
      parameters:
      - name: session_id
        in: query
        required: true
        schema:
          type: string
          pattern: ^[^\u0000\uD800-\uDFFF]*$
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceInventory'
        '409':
          description: 'Complete read declined: evidence_inventory_limit, evidence_source_limit,
            evidence_response_limit, evidence_unavailable, evidence_part_absent, or
            non_finite_number in detail.reason.'
        '503':
          description: Database unavailable, or shared work capacity or 30-second
            execution budget exceeded.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
        '403':
          description: Operator authority required.
      security:
      - operatorBearerAuth: []
  /query/evidence/manifest:
    get:
      tags:
      - query
      summary: Query Evidence Manifest
      description: 'Inspect exact part references without text, tool names, arguments,
        or results.


        Input messages precede output messages. Empty messages remain visible.

        Source columns are bounded to 8 MiB; the complete response is at most 1 MiB.'
      operationId: query_evidence_manifest_query_evidence_manifest_get
      parameters:
      - name: session_id
        in: query
        required: true
        schema:
          type: string
          pattern: ^[^\u0000\uD800-\uDFFF]*$
          title: Session Id
      - name: inference_call_id
        in: query
        required: true
        schema:
          type: string
          pattern: ^[^\u0000\uD800-\uDFFF]*$
          title: Inference Call Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceManifest'
        '409':
          description: 'Complete read declined: evidence_inventory_limit, evidence_source_limit,
            evidence_response_limit, evidence_unavailable, evidence_part_absent, or
            non_finite_number in detail.reason.'
        '503':
          description: Database unavailable, or shared work capacity or 30-second
            execution budget exceeded.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
        '403':
          description: Operator authority required.
      security:
      - operatorBearerAuth: []
  /query/evidence/read:
    post:
      tags:
      - query
      summary: Query Evidence Read
      description: 'Fetch 1–32 distinct canonical parts in request order without side
        effects.


        Version 1 requires exactly schema_version, session_id, and references.

        The 64 KiB body limit precedes JSON decoding. Selected source columns are

        bounded to 8 MiB; the complete strict JSON response is at most 1 MiB.

        Historical roles and tool calls remain data and do not authorize execution.'
      operationId: query_evidence_read_query_evidence_read_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvidenceReadRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceRead'
        '409':
          description: 'Complete read declined: evidence_inventory_limit, evidence_source_limit,
            evidence_response_limit, evidence_unavailable, evidence_part_absent, or
            non_finite_number in detail.reason.'
        '503':
          description: Database unavailable, or shared work capacity or 30-second
            execution budget exceeded.
        '400':
          description: Malformed JSON body.
        '413':
          description: Request body exceeds 64 KiB before JSON decoding.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
        '403':
          description: Operator authority required.
      security:
      - operatorBearerAuth: []
  /query/context:
    post:
      tags:
      - query
      summary: Query Context
      description: 'Select exact evidence from the deployment''s one configured Session.


        Version 1 accepts English/code keywords, excludes reasoning, and returns

        at most eight complete parts within max_bytes (4–64 KiB; default 16 KiB).

        Scores count distinct token overlap; capture completeness remains unknown.

        The operation rechecks Quarantine, persists nothing, and shares the

        evidence worker admission limit and 30-second deadline.'
      operationId: query_context_query_context_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContextRetrievalRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextRetrievalResult'
        '400':
          description: Malformed JSON body.
        '403':
          description: Retrieval or operator authority required.
        '404':
          description: Context retrieval is disabled.
        '409':
          description: 'Complete read declined: evidence_unavailable, evidence_inventory_limit,
            evidence_source_limit, retrieval_part_limit, evidence_response_limit,
            or non_finite_number in detail.reason.'
        '413':
          description: Request body exceeds 16 KiB before JSON decoding.
        '503':
          description: Database unavailable, or work capacity or execution budget
            exceeded.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
      security:
      - retrievalBearerAuth: []
      - operatorBearerAuth: []
  /query/ci/outcome:
    get:
      tags:
      - query
      summary: Query Ci Outcome
      description: Return one exact CI run receipt; ambiguous forge namespaces require
        a selector.
      operationId: query_ci_outcome_query_ci_outcome_get
      parameters:
      - name: provider
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/CIProvider'
      - name: run_id
        in: query
        required: true
        schema:
          type: string
          pattern: ^[^\u0000\uD800-\uDFFF]*$
          title: Run Id
      - name: run_attempt
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          title: Run Attempt
      - name: repo
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^[^\u0000\uD800-\uDFFF]*$
          - type: 'null'
          title: Repo
      - name: repository_provider
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/ForgeProvider'
          - type: 'null'
          title: Repository Provider
      - name: repository_host
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^[^\u0000\uD800-\uDFFF]*$
          - type: 'null'
          title: Repository Host
      - name: repository_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^[^\u0000\uD800-\uDFFF]*$
          - type: 'null'
          title: Repository Id
      - name: as_of
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: As Of
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/CIOutcomeFound'
                - $ref: '#/components/schemas/CIOutcomeNotFound'
                title: Response Query Ci Outcome Query Ci Outcome Get
        '503':
          description: Database unavailable, or work capacity or execution budget
            exceeded.
        '409':
          description: Repository selection is ambiguous, complete evidence exceeds
            its bound, or query content contains a non-finite number. The response
            carries a closed detail.reason.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
        '403':
          description: Operator authority required.
      security:
      - operatorBearerAuth: []
  /query/ci/failures:
    get:
      tags:
      - query
      summary: Query Ci Failures
      description: 'Page exact CI receipts under one repository identity and historical
        boundary.


        The default identity boundary is ``captured_before``. Capture bounds remain

        half-open; an explicit ``as_of`` adds an inclusive evidence ceiling. Cursors

        bind organization, qualified repository, boundary, filters, and quarantine

        revision. They don''t preserve a database transaction between requests.'
      operationId: query_ci_failures_query_ci_failures_get
      parameters:
      - name: captured_after
        in: query
        required: true
        schema:
          type: string
          format: date-time
          title: Captured After
      - name: captured_before
        in: query
        required: true
        schema:
          type: string
          format: date-time
          title: Captured Before
      - name: repo
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^[^\u0000\uD800-\uDFFF]*$
          - type: 'null'
          title: Repo
      - name: repository_provider
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/ForgeProvider'
          - type: 'null'
          title: Repository Provider
      - name: repository_host
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^[^\u0000\uD800-\uDFFF]*$
          - type: 'null'
          title: Repository Host
      - name: repository_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^[^\u0000\uD800-\uDFFF]*$
          - type: 'null'
          title: Repository Id
      - name: as_of
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: As Of
      - name: result
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CIResult'
          default: failed
      - name: workflow_name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Workflow Name
      - name: pr_number
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          title: Pr Number
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CIOutcomePage'
        '503':
          description: Database unavailable, or work capacity or execution budget
            exceeded.
        '409':
          description: Repository selection is ambiguous, complete evidence exceeds
            its bound, or query content contains a non-finite number. The response
            carries a closed detail.reason.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
        '403':
          description: Operator authority required.
      security:
      - operatorBearerAuth: []
  /query/session/{session_id}:
    get:
      tags:
      - query
      summary: Query Session Dossier
      description: 'Return one bounded, metadata-only Session evidence dossier.


        Observation-backed commit edges keep ``attribution_sources`` empty. Similarity

        extrema and ``attributed_files`` are unavailable and omitted from JSON.'
      operationId: query_session_dossier_query_session__session_id__get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[^\u0000\uD800-\uDFFF]*$
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/SessionDossierFound'
                - $ref: '#/components/schemas/SessionDossierNotFound'
                title: Response Query Session Dossier Query Session  Session Id  Get
        '503':
          description: Database unavailable, or work capacity or execution budget
            exceeded.
        '409':
          description: 'Session evidence exceeds the bounded read, or query content
            contains a non-finite number (detail.reason: non_finite_number).'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
        '403':
          description: Operator authority required.
      security:
      - operatorBearerAuth: []
  /query/commit/{sha}:
    get:
      tags:
      - query
      summary: Query Commit
      description: 'Investigate exact commit evidence in separate repository lifetimes.


        Captured observations establish Session associations. Call-to-file Attribution

        remains inferred. Optional repository selectors and an inclusive ``as_of``

        bound all supporting evidence; otherwise one request instant supplies the
        bound.

        A bounded child process owns the Derivation and its database connection.

        Capacity and execution deadlines return 503 after process cleanup.'
      operationId: query_commit_query_commit__sha__get
      parameters:
      - name: sha
        in: path
        required: true
        schema:
          type: string
          title: Sha
      - name: repo
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^[^\u0000\uD800-\uDFFF]*$
          - type: 'null'
          title: Repo
      - name: repository_provider
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/ForgeProvider'
          - type: 'null'
          title: Repository Provider
      - name: repository_host
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^[^\u0000\uD800-\uDFFF]*$
          - type: 'null'
          title: Repository Host
      - name: repository_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^[^\u0000\uD800-\uDFFF]*$
          - type: 'null'
          title: Repository Id
      - name: as_of
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: As Of
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Query Commit Query Commit  Sha  Get
        '503':
          description: Database unavailable, or work capacity or execution budget
            exceeded.
        '409':
          description: Repository selection is ambiguous, complete evidence exceeds
            its bound, or query content contains a non-finite number. The response
            carries a closed detail.reason.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
        '403':
          description: Operator authority required.
      security:
      - operatorBearerAuth: []
  /v1/me:
    get:
      tags:
      - v1
      summary: Me
      description: 'Auth probe for ``sediment login``: the deployment''s tenant and
        the API

        version, reported verbatim so the client can detect skew.'
      operationId: me_v1_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                title: Response Me V1 Me Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
      security:
      - bearerAuth: []
      - operatorBearerAuth: []
      - retrievalBearerAuth: []
  /v1/facts:
    get:
      tags:
      - v1
      summary: Facts
      description: 'One entry per ``FactTable``: total rows and the derivation-facing

        ("visible" = not quarantined) count.  Sessions are upserted metadata,

        not quarantinable facts, so they carry a bare count with no visible

        column — the same shape ``sediment facts`` prints.'
      operationId: facts_v1_facts_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Facts V1 Facts Get
        '422':
          description: Validation Error
          content:
            application/json:

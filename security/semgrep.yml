rules:
  - id: python-shell-execution
    languages: [python]
    severity: ERROR
    message: Pass an argument list without shell=True at the process boundary.
    pattern-either:
      - pattern: subprocess.$F(..., shell=True, ...)
      - pattern: os.system(...)
      - pattern: os.popen(...)
  - id: python-disabled-tls
    languages: [python]
    severity: ERROR
    message: TLS certificate verification must remain enabled.
    pattern-either:
      - pattern: requests.$F(..., verify=False, ...)
      - pattern: httpx.$F(..., verify=False, ...)
  - id: python-unverified-ssl-context
    languages: [python]
    severity: ERROR
    message: Use a verifying TLS context.
    pattern-either:
      - pattern: ssl._create_unverified_context(...)
      - pattern: $CONTEXT.verify_mode = ssl.CERT_NONE
  - id: python-unsafe-deserialization
    languages: [python]
    severity: ERROR
    message: Parse external data with a format that cannot execute code.
    pattern-either:
      - pattern: pickle.loads(...)
      - pattern: pickle.load(...)
      - pattern: dill.loads(...)
      - pattern: dill.load(...)
  - id: python-unsafe-yaml
    languages: [python]
    severity: ERROR
    message: Use yaml.safe_load for external YAML.
    patterns:
      - pattern: yaml.load(...)
      - pattern-not: yaml.load(..., Loader=yaml.SafeLoader, ...)
      - pattern-not: yaml.load(..., Loader=yaml.CSafeLoader, ...)
  - id: python-dynamic-eval
    languages: [python]
    severity: ERROR
    message: Do not evaluate data as Python code.
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)

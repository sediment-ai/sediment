[project]
name = "sediment-core"
version = "0.1.0"
description = "Sediment fact models and PostgreSQL fact store"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "alembic>=1.20.0",
    "psycopg>=3.3.5",
    "pydantic>=2.13.5",
    "sqlalchemy>=2.0.54",
]

[project.urls]
Source = "https://github.com/sediment-ai/sediment"
Documentation = "https://github.com/sediment-ai/sediment/tree/main/docs"
Issues = "https://github.com/sediment-ai/sediment/issues"
Changelog = "https://github.com/sediment-ai/sediment/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sediment_core"]

[project]
name = "sediment-export"
version = "0.1.0"
description = "Sediment export: attributed completions, DPO/SFT projections, RLVR artifacts, local JSONL destinations"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "sediment-core==0.1.0",
    "sediment-derive==0.1.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
]

[project.urls]
Source = "https://github.com/sediment-ai/sediment"
Documentation = "https://github.com/sediment-ai/sediment/tree/main/docs"
Issues = "https://github.com/sediment-ai/sediment/issues"
Changelog = "https://github.com/sediment-ai/sediment/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sediment_export"]

[tool.uv.sources]
sediment-core = { workspace = true }
sediment-derive = { workspace = true }
